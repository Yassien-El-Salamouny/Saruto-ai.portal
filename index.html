<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saruto AI</title>
    <style>
        :root {
            --bg-color: #020305;
            --surface-color: rgba(10, 15, 26, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            overflow: hidden;
            padding-bottom: clamp(20px, 4vh, 45px);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .portal-card {
            position: relative;
            z-index: 10;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.4rem 1.8rem;
            width: min(350px, 88vw);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
            will-change: transform, opacity;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .title {
            font-size: clamp(1.1rem, 3.8vw, 1.25rem);
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.2rem;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-bottom: 1.1rem;
        }

        .progress-wrapper {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            height: 6px;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 0.9rem;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #475569, #e2e8f0, #ffffff);
            border-radius: 999px;
            will-change: width;
            transition: width 0.3s ease-out;
        }

        .status-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: monospace;
        }

        .status-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 210px;
        }

        .timer-text {
            color: #f1f5f9;
            font-weight: 600;
        }

        /* Supernova Warp Out Transition */
        .warp-out .portal-card {
            opacity: 0;
            transform: translateY(15px) scale(0.95);
        }

        .warp-out #canvas-container {
            animation: gargantuaCollapse 0.9s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes gargantuaCollapse {
            0% { transform: scale(1); filter: brightness(1); opacity: 1; }
            50% { transform: scale(1.15); filter: brightness(3); opacity: 1; }
            100% { transform: scale(0); filter: brightness(10); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="gargantua"></canvas>
    </div>

    <div class="portal-card" id="card">
        <h1 class="title">Saruto AI Workspace</h1>
        <p class="subtitle">Dual-GPU Kaggle Infrastructure</p>
        
        <div class="progress-wrapper">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div class="status-wrapper">
            <span class="status-text" id="status">Checking server...</span>
            <span class="timer-text" id="timer">0s</span>
        </div>
    </div>

    <script>
        const TARGET_DOMAIN = "saruto-ai.opik.net";
        const progressEl = document.getElementById("progress");
        const statusEl = document.getElementById("status");
        const timerEl = document.getElementById("timer");

        const canvas = document.getElementById("gargantua");
        const ctx = canvas.getContext("2d", { alpha: false });

        let width, height, centerX, centerY;
        let particles = [];
        
        // TILT ANGLE: ~14 degrees rotated clockwise (right)
        const TILT_ANGLE = 14 * (Math.PI / 180);

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const numParticles = isMobile ? 70 : 130;

        // Offscreen static canvas cache for maximum performance
        let staticCanvas = document.createElement('canvas');
        let staticCtx = staticCanvas.getContext('2d');

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = isMobile ? height * 0.36 : height * 0.40;

            buildStaticCache();
        }

        function buildStaticCache() {
            staticCanvas.width = width;
            staticCanvas.height = height;

            staticCtx.save();
            staticCtx.translate(centerX, centerY);
            staticCtx.rotate(TILT_ANGLE);

            const R_EVENT = 42; // Event Horizon Radius (Compact Size)

            // 1. Outer Deep Space Energy Glow
            const outerGlow = staticCtx.createRadialGradient(0, 0, R_EVENT, 0, 0, 180);
            outerGlow.addColorStop(0, "rgba(255, 235, 200, 0.22)");
            outerGlow.addColorStop(0.3, "rgba(180, 200, 255, 0.08)");
            outerGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
            staticCtx.fillStyle = outerGlow;
            staticCtx.beginPath();
            staticCtx.arc(0, 0, 180, 0, Math.PI * 2);
            staticCtx.fill();

            // 2. Gravitational Lensing - Upper Halo Arch
            const topArchGrad = staticCtx.createRadialGradient(0, -10, R_EVENT * 0.8, 0, -10, 100);
            topArchGrad.addColorStop(0, "rgba(255, 255, 255, 0.95)");
            topArchGrad.addColorStop(0.35, "rgba(255, 220, 170, 0.6)");
            topArchGrad.addColorStop(0.8, "rgba(160, 190, 255, 0.15)");
            topArchGrad.addColorStop(1, "rgba(0, 0, 0, 0)");

            staticCtx.fillStyle = topArchGrad;
            staticCtx.beginPath();
            staticCtx.ellipse(0, -8, 88, 56, 0, Math.PI, Math.PI * 2);
            staticCtx.fill();

            // 3. Gravitational Lensing - Lower Halo Arch
            const bottomArchGrad = staticCtx.createRadialGradient(0, 10, R_EVENT * 0.8, 0, 10, 100);
            bottomArchGrad.addColorStop(0, "rgba(255, 255, 255, 0.85)");
            bottomArchGrad.addColorStop(0.35, "rgba(255, 210, 150, 0.5)");
            bottomArchGrad.addColorStop(0.8, "rgba(140, 170, 240, 0.1)");
            bottomArchGrad.addColorStop(1, "rgba(0, 0, 0, 0)");

            staticCtx.fillStyle = bottomArchGrad;
            staticCtx.beginPath();
            staticCtx.ellipse(0, 8, 88, 56, 0, 0, Math.PI);
            staticCtx.fill();

            // 4. Main Accretion Beam Across Center (With Doppler Beaming Intensity)
            const diskGrad = staticCtx.createLinearGradient(-220, 0, 220, 0);
            diskGrad.addColorStop(0, "rgba(255, 255, 255, 0.05)");
            diskGrad.addColorStop(0.2, "rgba(255, 245, 230, 0.95)"); // Bright approaching left side
            diskGrad.addColorStop(0.5, "rgba(255, 255, 255, 1.0)");
            diskGrad.addColorStop(0.8, "rgba(255, 210, 160, 0.55)"); // Dimmer receding right side
            diskGrad.addColorStop(1, "rgba(255, 180, 120, 0)");

            staticCtx.fillStyle = diskGrad;
            staticCtx.beginPath();
            staticCtx.ellipse(0, 0, 210, 6.5, 0, 0, Math.PI * 2);
            staticCtx.fill();

            // 5. Absolute Pitch-Black Event Horizon
            staticCtx.beginPath();
            staticCtx.arc(0, 0, R_EVENT, 0, Math.PI * 2);
            staticCtx.fillStyle = "#020305";
            staticCtx.fill();

            // 6. Sharp Luminous Photon Ring
            staticCtx.beginPath();
            staticCtx.arc(0, 0, R_EVENT + 1.2, 0, Math.PI * 2);
            staticCtx.strokeStyle = "rgba(255, 255, 255, 0.95)";
            staticCtx.lineWidth = 1.2;
            staticCtx.stroke();

            staticCtx.restore();
        }

        window.addEventListener("resize", resize);

        class AccretionParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.angle = Math.random() * Math.PI * 2;
                this.distance = Math.random() * 110 + 48; 
                this.speed = (0.005 + Math.random() * 0.008) * (80 / this.distance);
                this.size = Math.random() * 1.1 + 0.3;
                this.alpha = Math.random() * 0.75 + 0.25;
            }

            update() {
                this.angle += this.speed;
                this.distance -= 0.05; 
                if (this.distance < 43) this.reset();
            }

            draw() {
                // Horizontal disk coordinates
                let x = Math.cos(this.angle) * this.distance * 2.0;
                let y = Math.sin(this.angle) * (this.distance * 0.11);

                // Gravitational bending behind event horizon
                const isBehind = Math.sin(this.angle) < 0;
                if (isBehind) {
                    const distFromCenter = Math.abs(x);
                    if (distFromCenter < 90) {
                        const warpFactor = Math.cos((distFromCenter / 90) * (Math.PI / 2));
                        y -= warpFactor * 50; 
                    }
                }

                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }
        }

        resize();
        for (let i = 0; i < numParticles; i++) {
            particles.push(new AccretionParticle());
        }

        // --- RENDER LOOP ---
        function renderFrame() {
            // Draw pre-cached static background
            ctx.drawImage(staticCanvas, 0, 0);

            // Render dynamic accretion particle swarm inside tilted space
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(TILT_ANGLE);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            ctx.restore();
            requestAnimationFrame(renderFrame);
        }
        requestAnimationFrame(renderFrame);

        // --- REALTIME 1-SECOND TIMER ---
        let elapsedSeconds = 0;
        setInterval(() => {
            elapsedSeconds++;
            timerEl.innerText = `${elapsedSeconds}s`;
        }, 1000);

        // --- HEALTHCHECK & REDIRECT ---
        let isRedirecting = false;

        async function checkServerStatus() {
            if (isRedirecting) return;

            let progressVal = Math.min((elapsedSeconds / 60) * 100, 92);
            progressEl.style.width = `${progressVal}%`;
            statusEl.innerText = `Connecting... (${elapsedSeconds}s)`;

            const protocol = window.location.protocol === 'https:' ? 'https:' : 'http:';
            const targetUrl = `${protocol}//${TARGET_DOMAIN}`;

            try {
                await fetch(targetUrl, { mode: 'no-cors' });
                
                isRedirecting = true;
                progressEl.style.width = "100%";
                statusEl.innerText = "Server Online! Redirecting...";
                
                setTimeout(() => {
                    document.body.classList.add("warp-out");
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 800);
                }, 200);

            } catch (e) {
                // Retry every 3 seconds if offline
                setTimeout(checkServerStatus, 3000);
            }
        }

        // Initial check trigger
        checkServerStatus();
    </script>
</body>
</html>
