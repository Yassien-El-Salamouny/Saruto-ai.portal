<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saruto AI Workspace</title>
    <link rel="icon" type="image/svg+xml" href="assets/Boundless.svg">
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: rgba(10, 15, 26, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            overflow: hidden;
            padding-bottom: clamp(20px, 4vh, 45px);
        }

        #gargantua {
            position: absolute;
            top: 38%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            filter: grayscale(100%) brightness(1.2) contrast(1.1);
        }

        .portal-card {
            position: relative;
            z-index: 10;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.4rem 1.8rem;
            width: min(350px, 88vw);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
            will-change: transform, opacity;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand-logo {
            width: 85px;
            height: auto;
            margin: 0 auto 0.5rem auto;
            display: block;
        }

        .title {
            font-size: clamp(1.1rem, 3.8vw, 1.25rem);
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.2rem;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-bottom: 1.1rem;
        }

        .progress-wrapper {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            height: 6px;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 0.9rem;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #475569, #e2e8f0, #ffffff);
            border-radius: 999px;
            will-change: width;
            transition: width 0.3s ease-out;
        }

        .status-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: monospace;
        }

        .status-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 210px;
        }

        .timer-text {
            color: #f1f5f9;
            font-weight: 600;
        }

        .warp-out .portal-card {
            opacity: 0;
            transform: translateY(15px) scale(0.95);
        }

        .warp-out #gargantua {
            animation: gargantuaCollapse 0.9s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes gargantuaCollapse {
            0% { transform: translate(-50%, -50%) scale(1); filter: grayscale(100%) brightness(1.2) contrast(1.1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.15); filter: grayscale(100%) brightness(3) contrast(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); filter: grayscale(100%) brightness(10) contrast(1.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <video id="gargantua" autoplay loop muted playsinline>
        <source src="assets/Black_hole.webm" type="video/webm">
    </video>

    <div class="portal-card" id="card">
        <img src="assets/Boundless.svg" alt="Saruto AI" class="brand-logo">
        <h1 class="title">Saruto AI Workspace</h1>
        <p class="subtitle">Dual-GPU Kaggle Infrastructure</p>
        
        <div class="progress-wrapper">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div class="status-wrapper">
            <span class="status-text" id="status">Connecting proxy...</span>
            <span class="timer-text" id="timer">0s</span>
        </div>
    </div>

    <script>
    const progressEl = document.getElementById("progress");
    const statusEl = document.getElementById("status");
    const timerEl = document.getElementById("timer");

    const PROXY_BOOT_URL = "https://kaggle-boot-proxy.thegamerx761.workers.dev"; 

    let elapsedSeconds = 0;
    setInterval(() => {
        elapsedSeconds++;
        if (timerEl) timerEl.innerText = `${elapsedSeconds}s`;
    }, 1000);

    let isRedirecting = false;

    // 1. Dispatch boot signal to Cloudflare Proxy
    async function triggerKaggleBoot() {
        try {
            if (statusEl) statusEl.innerText = "Triggering Kaggle GPU VM...";
            await fetch(PROXY_BOOT_URL, { 
                method: "POST",
                headers: { "Content-Type": "application/json" }
            });
        } catch (e) {
            console.log("Proxy trigger sent or session already warm.");
        }
    }

    // 2. Poll current domain for Open WebUI takeover
    async function checkServerStatus() {
        if (isRedirecting) return;

        // Target timing: ~35 seconds for dataset wheel/model spinup
        let progressVal = Math.min((elapsedSeconds / 35) * 100, 95);
        if (progressEl) progressEl.style.width = `${progressVal}%`;
        if (statusEl) statusEl.innerText = `Launching Engines... (${elapsedSeconds}s)`;

        try {
            // Append timestamp to break browser HTTP cache
            const cacheBustUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?_t=${Date.now()}`;
            let res = await fetch(cacheBustUrl, { cache: "no-store" });
            let htmlContent = await res.text();
            
            // If response no longer contains loading screen mark, Open WebUI is serving!
            if (!htmlContent.includes("gargantua")) {
                isRedirecting = true;
                if (progressEl) progressEl.style.width = "100%";
                if (statusEl) statusEl.innerText = "Online! Transitioning...";
                
                setTimeout(() => {
                    document.body.classList.add("warp-out");
                    setTimeout(() => {
                        window.location.reload(true);
                    }, 800);
                }, 200);
            } else {
                setTimeout(checkServerStatus, 2500);
            }
        } catch (e) {
            setTimeout(checkServerStatus, 2500);
        }
    }

    // Fire auto-boot and status polling
    triggerKaggleBoot();
    checkServerStatus();
    </script>
</body>
</html>
