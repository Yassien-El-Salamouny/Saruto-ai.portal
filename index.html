<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saruto AI — Initializing Workspace</title>
    <style>
        :root {
            --bg-color: #030508;
            --surface-color: rgba(15, 23, 42, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glow-color: rgba(255, 255, 255, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .portal-card {
            position: relative;
            z-index: 10;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.2rem 2rem;
            width: 380px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .title {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.3rem;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1.8rem;
        }

        .progress-wrapper {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 1.2rem;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #94a3b8, #ffffff);
            border-radius: 999px;
            box-shadow: 0 0 12px var(--glow-color);
            transition: width 0.4s ease;
        }

        .status-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: monospace;
        }

        /* End-of-loading Supernova Transition */
        .warp-out .portal-card {
            opacity: 0;
            transform: scale(0.9);
        }

        .warp-out #canvas-container {
            animation: gargantuaCollapse 1.2s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes gargantuaCollapse {
            0% { transform: scale(1); filter: brightness(1); opacity: 1; }
            30% { transform: scale(1.3); filter: brightness(3); opacity: 1; }
            100% { transform: scale(0); filter: brightness(10); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="gargantua"></canvas>
    </div>

    <div class="portal-card" id="card">
        <h1 class="title">Saruto AI Workspace</h1>
        <p class="subtitle">Dual-GPU Kaggle Infrastructure</p>
        
        <div class="progress-wrapper">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div class="status-text" id="status">Connecting to saruto-ai.opik.net...</div>
    </div>

    <script>
        const TARGET_DOMAIN = "saruto-ai.opik.net";
        const progressEl = document.getElementById("progress");
        const statusEl = document.getElementById("status");

        // --- GARGANTUA INTERSTELLAR BLACK HOLE ENGINE ---
        const canvas = document.getElementById("gargantua");
        const ctx = canvas.getContext("2d");

        let width, height, centerX, centerY;
        let particles = [];
        const numParticles = 600;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2 - 20;
        }
        window.addEventListener("resize", resize);
        resize();

        class AccretionParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.angle = Math.random() * Math.PI * 2;
                this.distance = Math.random() * 220 + 85; 
                this.speed = (0.003 + Math.random() * 0.008) * (140 / this.distance);
                this.size = Math.random() * 1.5 + 0.4;
                this.alpha = Math.random() * 0.8 + 0.2;
            }

            update() {
                this.angle += this.speed;
                this.distance -= 0.05; 
                if (this.distance < 75) this.reset();
            }

            draw() {
                // Flatten coordinates for horizontal disk tilt
                let x = centerX + Math.cos(this.angle) * this.distance * 2.2;
                let y = centerY + Math.sin(this.angle) * (this.distance * 0.12);

                // Gravitational Lensing effect (lensing arch behind event horizon)
                const isBehind = Math.sin(this.angle) < 0;
                if (isBehind) {
                    const distFromCenter = Math.abs(x - centerX);
                    if (distFromCenter < 170) {
                        // Bend trajectory upward/downward into a halo arch
                        const warpFactor = Math.cos((distFromCenter / 170) * (Math.PI / 2));
                        y -= warpFactor * 85; 
                    }
                }

                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.shadowBlur = 6;
                ctx.shadowColor = "#ffffff";
                ctx.fill();
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new AccretionParticle());
        }

        function drawGargantua() {
            ctx.clearRect(0, 0, width, height);

            // 1. Distant Background Glow
            const outerGlow = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, 300);
            outerGlow.addColorStop(0, "rgba(255, 255, 255, 0.15)");
            outerGlow.addColorStop(0.4, "rgba(200, 220, 255, 0.05)");
            outerGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
            ctx.fillStyle = outerGlow;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 300, 0, Math.PI * 2);
            ctx.fill();

            // 2. Gravitational Lensing Arc (Top Arch)
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(centerX, centerY - 15, 140, 90, 0, Math.PI, Math.PI * 2);
            ctx.lineWidth = 14;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#ffffff";
            ctx.stroke();
            ctx.restore();

            // 3. Gravitational Lensing Arc (Bottom Arch)
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 15, 140, 90, 0, 0, Math.PI);
            ctx.lineWidth = 14;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#ffffff";
            ctx.stroke();
            ctx.restore();

            // 4. Infalling Particles Swarm
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // 5. Bright Horizontal Accretion Line (Across Front)
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, 380, 12, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
            ctx.shadowBlur = 25;
            ctx.shadowColor = "#ffffff";
            ctx.fill();
            ctx.restore();

            // 6. Absolute Event Horizon Core
            ctx.beginPath();
            ctx.arc(centerX, centerY, 72, 0, Math.PI * 2);
            ctx.fillStyle = "#000000";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#000000";
            ctx.fill();

            // 7. Thin Bright Photon Ring (Event Horizon Edge)
            ctx.beginPath();
            ctx.arc(centerX, centerY, 73.5, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ffffff";
            ctx.stroke();

            requestAnimationFrame(drawGargantua);
        }
        drawGargantua();

        // --- HEALTHCHECK & REDIRECT ---
        let attempts = 0;
        async function checkServer() {
            attempts++;
            let percent = Math.min(attempts * 5, 90);
            progressEl.style.width = percent + "%";

            try {
                let res = await fetch(`http://${TARGET_DOMAIN}`, { mode: 'no-cors' });
                progressEl.style.width = "100%";
                statusEl.innerText = "Server Online! Opening OpenWebUI...";
                
                setTimeout(() => {
                    document.body.classList.add("warp-out");
                    setTimeout(() => {
                        window.location.href = `http://${TARGET_DOMAIN}`;
                    }, 1100);
                }, 400);

            } catch (e) {
                statusEl.innerText = `Waiting for Kaggle VM... (${attempts * 3}s)`;
                setTimeout(checkServer, 3000);
            }
        }

        checkServer();
    </script>
</body>
</html>
