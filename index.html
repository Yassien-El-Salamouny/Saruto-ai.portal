<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saruto AI</title>
    <style>
        :root {
            --bg-color: #030508;
            --surface-color: rgba(12, 18, 30, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glow-color: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Move card to the bottom */
            align-items: center;
            overflow: hidden;
            padding-bottom: clamp(20px, 5vh, 50px);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .portal-card {
            position: relative;
            z-index: 10;
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem 1.8rem;
            width: min(360px, 90vw);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            will-change: transform, opacity;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .title {
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.2rem;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 1.2rem;
        }

        .progress-wrapper {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            height: 6px;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #64748b, #ffffff);
            border-radius: 999px;
            will-change: width;
            transition: width 0.2s linear;
        }

        .status-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: monospace;
        }

        .status-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .timer-text {
            color: #f1f5f9;
            font-weight: 600;
        }

        /* End-of-loading Supernova Transition */
        .warp-out .portal-card {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
        }

        .warp-out #canvas-container {
            animation: gargantuaCollapse 1s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes gargantuaCollapse {
            0% { transform: scale(1); filter: brightness(1); opacity: 1; }
            40% { transform: scale(1.2); filter: brightness(2.5); opacity: 1; }
            100% { transform: scale(0); filter: brightness(8); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="gargantua"></canvas>
    </div>

    <div class="portal-card" id="card">
        <h1 class="title">Saruto AI Workspace</h1>
        <p class="subtitle">Dual-GPU Kaggle Infrastructure</p>
        
        <div class="progress-wrapper">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div class="status-wrapper">
            <span class="status-text" id="status">Connecting...</span>
            <span class="timer-text" id="timer">0s</span>
        </div>
    </div>

    <script>
        const TARGET_DOMAIN = "saruto-ai.opik.net";
        const progressEl = document.getElementById("progress");
        const statusEl = document.getElementById("status");
        const timerEl = document.getElementById("timer");

        const canvas = document.getElementById("gargantua");
        const ctx = canvas.getContext("2d", { alpha: false });

        let width, height, centerX, centerY;
        let particles = [];
        
        // Detect mobile hardware to reduce load
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const numParticles = isMobile ? 80 : 160;

        // Static shape cache canvas for zero-lag rendering
        let staticCanvas = document.createElement('canvas');
        let staticCtx = staticCanvas.getContext('2d');

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = isMobile ? height * 0.38 : height * 0.42; // Move blackhole slightly up relative to screen size

            buildStaticCache();
        }

        function buildStaticCache() {
            staticCanvas.width = width;
            staticCanvas.height = height;

            // 1. Distant Background Glow
            const outerGlow = staticCtx.createRadialGradient(centerX, centerY, 30, centerX, centerY, 240);
            outerGlow.addColorStop(0, "rgba(255, 255, 255, 0.12)");
            outerGlow.addColorStop(0.5, "rgba(200, 220, 255, 0.03)");
            outerGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
            staticCtx.fillStyle = outerGlow;
            staticCtx.beginPath();
            staticCtx.arc(centerX, centerY, 240, 0, Math.PI * 2);
            staticCtx.fill();

            // 2. Gravitational Lensing Arc (Top Arch)
            staticCtx.save();
            staticCtx.beginPath();
            staticCtx.ellipse(centerX, centerY - 12, 120, 75, 0, Math.PI, Math.PI * 2);
            staticCtx.lineWidth = 10;
            staticCtx.strokeStyle = "rgba(255, 255, 255, 0.85)";
            if (!isMobile) { staticCtx.shadowBlur = 15; staticCtx.shadowColor = "#ffffff"; }
            staticCtx.stroke();
            staticCtx.restore();

            // 3. Gravitational Lensing Arc (Bottom Arch)
            staticCtx.save();
            staticCtx.beginPath();
            staticCtx.ellipse(centerX, centerY + 12, 120, 75, 0, 0, Math.PI);
            staticCtx.lineWidth = 10;
            staticCtx.strokeStyle = "rgba(255, 255, 255, 0.85)";
            if (!isMobile) { staticCtx.shadowBlur = 15; staticCtx.shadowColor = "#ffffff"; }
            staticCtx.stroke();
            staticCtx.restore();

            // 4. Bright Horizontal Accretion Line
            staticCtx.save();
            staticCtx.beginPath();
            staticCtx.ellipse(centerX, centerY, 300, 9, 0, 0, Math.PI * 2);
            staticCtx.fillStyle = "rgba(255, 255, 255, 0.95)";
            if (!isMobile) { staticCtx.shadowBlur = 20; staticCtx.shadowColor = "#ffffff"; }
            staticCtx.fill();
            staticCtx.restore();

            // 5. Black Hole Event Horizon
            staticCtx.beginPath();
            staticCtx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            staticCtx.fillStyle = "#030508";
            staticCtx.fill();

            // 6. Photon Ring Edge
            staticCtx.beginPath();
            staticCtx.arc(centerX, centerY, 61.5, 0, Math.PI * 2);
            staticCtx.strokeStyle = "rgba(255, 255, 255, 0.9)";
            staticCtx.lineWidth = 1.5;
            staticCtx.stroke();
        }

        window.addEventListener("resize", resize);

        class AccretionParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.angle = Math.random() * Math.PI * 2;
                this.distance = Math.random() * 160 + 70; 
                this.speed = (0.004 + Math.random() * 0.008) * (110 / this.distance);
                this.size = Math.random() * 1.2 + 0.4;
                this.alpha = Math.random() * 0.8 + 0.2;
            }

            update() {
                this.angle += this.speed;
                this.distance -= 0.06; 
                if (this.distance < 62) this.reset();
            }

            draw() {
                let x = centerX + Math.cos(this.angle) * this.distance * 2.0;
                let y = centerY + Math.sin(this.angle) * (this.distance * 0.12);

                const isBehind = Math.sin(this.angle) < 0;
                if (isBehind) {
                    const distFromCenter = Math.abs(x - centerX);
                    if (distFromCenter < 130) {
                        const warpFactor = Math.cos((distFromCenter / 130) * (Math.PI / 2));
                        y -= warpFactor * 70; 
                    }
                }

                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }
        }

        resize();
        for (let i = 0; i < numParticles; i++) {
            particles.push(new AccretionParticle());
        }

        // --- HIGH-PRECISION REALTIME LOOP ---
        const startTime = performance.now();
        let lastPingTime = 0;
        let isRedirecting = false;

        function renderFrame(now) {
            // Update Timer continuously without lag
            const elapsedSeconds = Math.floor((now - startTime) / 1000);
            timerEl.innerText = `${elapsedSeconds}s`;

            // Draw pre-cached background & static lens layers
            ctx.drawImage(staticCanvas, 0, 0);

            // Draw dynamic orbiting particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            // Health check ping trigger (Every 3 seconds)
            if (now - lastPingTime > 3000 && !isRedirecting) {
                lastPingTime = now;
                checkServerStatus(elapsedSeconds);
            }

            requestAnimationFrame(renderFrame);
        }

        async function checkServerStatus(elapsedSeconds) {
            statusEl.innerText = `Connecting... (${elapsedSeconds}s)`;
            
            // Progress bar estimation
            let progressVal = Math.min((elapsedSeconds / 60) * 100, 92);
            progressEl.style.width = `${progressVal}%`;

            try {
                let res = await fetch(`http://${TARGET_DOMAIN}`, { mode: 'no-cors' });
                isRedirecting = true;
                progressEl.style.width = "100%";
                statusEl.innerText = "Server Online! Opening...";
                
                setTimeout(() => {
                    document.body.classList.add("warp-out");
                    setTimeout(() => {
                        window.location.href = `http://${TARGET_DOMAIN}`;
                    }, 1000);
                }, 300);

            } catch (e) {
                // Continued retry state
            }
        }

        requestAnimationFrame(renderFrame);
    </script>
</body>
</html>
